[package]
name = "sources-spotify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sources_spotify"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
core = { path = "../../core" }
player = { path = "../../player" }
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-audio = "0.8.0"
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
hmac = "0.12"
sha1 = "0.10"
