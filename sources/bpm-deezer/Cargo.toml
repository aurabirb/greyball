[package]
name = "bpm-deezer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bpm_deezer"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
core = { path = "../../core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
