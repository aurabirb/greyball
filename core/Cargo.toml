[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# The crate is named `core`; rustdoc's doctest harness adds `--extern core`,
# which shadows `libcore` paths in derive-macro output. There are no doc
# examples, so disable doctests rather than rename the crate.
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redb = "2"
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
futures = "0.3"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.9"
toml = "0.8"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac"] }
base64 = "0.22"

