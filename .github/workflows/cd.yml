name: CD

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  TERM: xterm

permissions:
  contents: write

jobs:
  publish:
    name: Publishing ${{ matrix.build_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build_target: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - build_target: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - build_target: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        name: Checkout src
      - name: Install rustup
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev pkg-config flatpak flatpak-builder
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Running cargo build
        run: cargo build --release --target ${{ matrix.target }} -p app --all-features
      - name: Packaging binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          bin="medley-${{ matrix.build_target }}"
          cp medley "$bin"
          shasum -a 256 "$bin" > "$bin.sha256"
      - name: Packaging Flatpak
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/flatpak
          cp target/${{ matrix.target }}/release/medley target/flatpak/medley
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --state-dir=target/flatpak/state --repo=target/flatpak/repo target/flatpak/build flatpak/io.github.aurabirb.greyball.yml
          cd target/${{ matrix.target }}/release
          bundle="medley-${{ matrix.build_target }}.flatpak"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo ../../flatpak/repo "$bundle" io.github.aurabirb.greyball
          shasum -a 256 "$bundle" > "$bundle.sha256"
      - name: Releasing assets
        uses: softprops/action-gh-release@v3
        with:
          files: target/${{ matrix.target }}/release/medley-${{ matrix.build_target }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
