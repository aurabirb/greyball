[workspace]
resolver = "2"
members = [
    "core",
    "sources/http",
    "sources/spotify",
    "sources/soundcloud",
    "sources/soulseek",
    "sources/bpm",
    "sources/waveform",
    "player",
    "ui",
    "app",
]

[workspace.package]
version = "0.2.10"
authors = ["medley"]
edition = "2024"
license = "MIT"
repository = "https://github.com/aurabirb/greyball"

[workspace.lints.clippy]
enum_glob_use = "warn"

[profile.release]
lto = true
codegen-units = 1
